- name: Hardening for Fusion Lab
  hosts: all
  become: yes
  vars:
    worker_user: "{{ worker_user | default('worker') }}"
    allowed_subnet: "{{ allowed_subnet }}"
    ssh_public_key: "{{ ssh_public_key }}"

  tasks:
    - name: Set system hostname
      hostname:
        name: "{{ hostname }}"
      when: hostname is defined

    - name: Update system
      apt:
        update_cache: yes
        upgrade: dist
        autoremove: yes

    - name: Install security tools
      apt:
        name:
          - ufw
          - fail2ban
          - lynis
          - unattended-upgrades
          - apparmor
        state: present

    - name: Create worker user
      user:
        name: "{{ worker_user }}"
        shell: /bin/bash
        groups: sudo
        append: yes
        create_home: yes

    - name: Inject SSH Public Key
      authorized_key:
        user: "{{ worker_user }}"
        key: "{{ ssh_public_key }}"
        state: present
        manage_dir: yes

    - name: Passwordless sudo
      copy:
        content: "{{ worker_user }} ALL=(ALL) NOPASSWD:ALL"
        dest: "/etc/sudoers.d/{{ worker_user }}"
        mode: "0440"

    - name: Disable root SSH
      lineinfile:
        path: /etc/ssh/sshd_config
        regexp: "^PermitRootLogin"
        line: "PermitRootLogin no"

    - name: Enforce key-only auth
      lineinfile:
        path: /etc/ssh/sshd_config
        regexp: "^PasswordAuthentication"
        line: "PasswordAuthentication no"

    - name: Setup UFW
      community.general.ufw:
        rule: allow
        port: "22"
        from_ip: "{{ allowed_subnet }}"
      notify: Enable UFW

    - name: Enable Fail2Ban
      service:
        name: fail2ban
        state: started
        enabled: yes

    - name: Lynis Audit
      command: lynis audit system --quiet --logfile /var/log/lynis.log
      changed_when: false

  handlers:
    - name: Enable UFW
      command: ufw --force enable
    - name: Restart SSH
      service:
        name: ssh
        state: restarted
